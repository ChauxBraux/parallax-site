<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive - The Parallax</title>
  <meta name="description" content="Browse past issues of The Parallax daily news digest.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --navy: #1d3557;
      --blue: #457b9d;
      --light-blue: #a8dadc;
      --cream: #f8f9fa;
      --text: #1a1a1a;
      --text-light: #6c757d;
    }
    
    body {
      font-family: 'Source Sans Pro', -apple-system, sans-serif;
      color: var(--text);
      line-height: 1.6;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Navigation */
    nav {
      background: white;
      border-bottom: 1px solid #e9ecef;
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .nav-logo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.5em;
      font-weight: 700;
      color: var(--navy);
      text-decoration: none;
      letter-spacing: 1px;
    }
    
    .nav-links {
      display: flex;
      gap: 32px;
    }
    
    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95em;
      transition: color 0.2s;
    }
    
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--blue);
    }
    
    /* Page Header */
    .page-header {
      background: white;
      padding: 60px 24px;
      text-align: center;
      border-bottom: 1px solid #e9ecef;
    }
    
    .page-header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.5em;
      color: var(--navy);
      margin-bottom: 12px;
    }
    
    .page-header p {
      color: var(--text-light);
      font-size: 1.1em;
    }
    
    /* Archive List */
    .archive-container {
      max-width: 700px;
      margin: 0 auto;
      padding: 48px 24px;
      flex: 1;
    }
    
    .archive-list {
      list-style: none;
    }
    
    .archive-list li {
      background: white;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .archive-list li:hover {
      border-color: var(--blue);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    
    .archive-list a {
      display: block;
      padding: 20px 24px;
      text-decoration: none;
      color: var(--text);
    }
    
    .archive-list .issue-date {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.2em;
      color: var(--navy);
      margin-bottom: 4px;
    }
    
    .archive-list .issue-preview {
      font-size: 0.9em;
      color: var(--text-light);
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-light);
    }
    
    .empty-state p {
      margin-bottom: 24px;
    }
    
    .empty-state a {
      color: var(--blue);
      text-decoration: underline;
    }
    
    /* Footer */
    footer {
      background: #111;
      color: white;
      padding: 40px 24px;
      text-align: center;
      margin-top: auto;
    }
    
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 24px;
    }
    
    .footer-links a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.9em;
    }
    
    .footer-links a:hover {
      color: white;
    }
    
    .footer-note {
      font-size: 0.8em;
      color: rgba(255,255,255,0.5);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .page-header h1 {
        font-size: 2em;
      }
      
      .nav-links {
        gap: 20px;
      }
    }
    
    @media (max-width: 480px) {
      .nav-links {
        gap: 16px;
        font-size: 0.9em;
      }
      
      .archive-list a {
        padding: 16px 20px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <a href="/" class="nav-logo">THE PARALLAX</a>
      <div class="nav-links">
        <a href="/about.html">About</a>
        <a href="/archive/" class="active">Archive</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <h1>Archive</h1>
    <p>Browse past issues</p>
  </header>

  <main class="archive-container">
    <ul class="archive-list">
      <li>
        <a href="the-parallax---tuesday--january-27--2026.html">
          <div class="issue-date">Tuesday, January 27, 2026</div>
          <div class="issue-preview">Minneapolis ICE shooting, South Korea tariffs, Gaza ceasefire updates...</div>
        </a>
      </li>
    </ul>
  </main>

  <footer>
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/archive/">Archive</a>
    </div>
    <p class="footer-note">
      The Parallax is generated using AI analysis of news sources across the political spectrum.<br>
      Pittsburgh, PA
    </p>
  </footer>
</body>
</html>
