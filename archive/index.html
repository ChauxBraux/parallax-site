<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive - The Parallax</title>
  <meta name="description" content="Browse past issues of The Parallax daily news digest.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --navy: #1d3557;
      --blue: #457b9d;
      --light-blue: #a8dadc;
      --cream: #f8f9fa;
      --text: #1a1a1a;
      --text-light: #6c757d;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      font-family: 'Source Sans Pro', -apple-system, sans-serif;
      color: var(--text);
      line-height: 1.6;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    
    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out forwards;
    }
    
    .delay-1 { animation-delay: 0.1s; opacity: 0; }
    
    /* Navigation */
    nav {
      background: white;
      border-bottom: 1px solid #e9ecef;
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      transition: box-shadow 0.3s ease;
    }
    
    nav.scrolled {
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }
    
    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .nav-logo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.5em;
      font-weight: 700;
      color: var(--navy);
      text-decoration: none;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    
    .nav-logo:hover {
      opacity: 0.8;
    }
    
    .nav-links {
      display: flex;
      gap: 32px;
    }
    
    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95em;
      transition: color 0.2s;
      position: relative;
      padding: 4px 0;
    }
    
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--blue);
      transition: width 0.3s ease;
    }
    
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--blue);
    }
    
    .nav-links a.active::after,
    .nav-links a:hover::after {
      width: 100%;
    }
    
    /* Page Header */
    .page-header {
      background: white;
      padding: 60px 24px;
      text-align: center;
      border-bottom: 1px solid #e9ecef;
    }
    
    .page-header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2em, 6vw, 2.5em);
      color: var(--navy);
      margin-bottom: 12px;
    }
    
    .page-header p {
      color: var(--text-light);
      font-size: clamp(1em, 3vw, 1.1em);
    }
    
    /* Archive List */
    .archive-container {
      max-width: 700px;
      margin: 0 auto;
      padding: 48px 24px;
      flex: 1;
    }
    
    .archive-list {
      list-style: none;
    }
    
    .archive-list li {
      background: white;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #e9ecef;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.5s ease-out forwards;
    }
    
    .archive-list li:nth-child(1) { animation-delay: 0.1s; }
    .archive-list li:nth-child(2) { animation-delay: 0.15s; }
    .archive-list li:nth-child(3) { animation-delay: 0.2s; }
    .archive-list li:nth-child(4) { animation-delay: 0.25s; }
    .archive-list li:nth-child(5) { animation-delay: 0.3s; }
    .archive-list li:nth-child(6) { animation-delay: 0.35s; }
    .archive-list li:nth-child(7) { animation-delay: 0.4s; }
    .archive-list li:nth-child(8) { animation-delay: 0.45s; }
    .archive-list li:nth-child(9) { animation-delay: 0.5s; }
    .archive-list li:nth-child(10) { animation-delay: 0.55s; }
    
    .archive-list li:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      border-color: var(--blue);
    }
    
    .archive-list a {
      display: block;
      padding: 20px 24px;
      text-decoration: none;
      color: var(--text);
    }
    
    .archive-list .issue-date {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.1em, 3vw, 1.2em);
      color: var(--navy);
      margin-bottom: 4px;
      transition: color 0.2s;
    }
    
    .archive-list li:hover .issue-date {
      color: var(--blue);
    }
    
    .archive-list .issue-preview {
      font-size: clamp(0.85em, 2.5vw, 0.9em);
      color: var(--text-light);
      line-height: 1.5;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-light);
    }
    
    .empty-state p {
      margin-bottom: 24px;
    }
    
    .empty-state a {
      color: var(--blue);
      text-decoration: underline;
    }
    
    /* Footer */
    footer {
      background: #111;
      color: white;
      padding: 40px 24px;
      text-align: center;
      margin-top: auto;
    }
    
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    
    .footer-links a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 0.9em;
      transition: color 0.2s;
    }
    
    .footer-links a:hover {
      color: white;
    }
    
    .footer-note {
      font-size: 0.8em;
      color: rgba(255,255,255,0.5);
      line-height: 1.8;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .page-header {
        padding: 48px 20px;
      }
      
      .nav-links {
        gap: 24px;
      }
      
      .archive-container {
        padding: 40px 20px;
      }
    }
    
    @media (max-width: 480px) {
      nav {
        padding: 14px 16px;
      }
      
      .nav-logo {
        font-size: 1.3em;
      }
      
      .nav-links {
        gap: 16px;
      }
      
      .nav-links a {
        font-size: 0.9em;
      }
      
      .page-header {
        padding: 40px 16px;
      }
      
      .archive-container {
        padding: 32px 16px;
      }
      
      .archive-list a {
        padding: 16px 20px;
      }
      
      .footer-links {
        gap: 20px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <a href="/" class="nav-logo">THE PARALLAX</a>
      <div class="nav-links">
        <a href="/about.html">About</a>
        <a href="/archive/" class="active">Archive</a>
      </div>
    </div>
  </nav>

  <header class="page-header">
    <h1 class="animate-fade-in-up">Archive</h1>
    <p class="animate-fade-in-up delay-1">Browse past issues</p>
  </header>

  <main class="archive-container">
    <ul class="archive-list">
      <li>
        <a href="the-parallax---tuesday--january-27--2026.html">
          <div class="issue-date">Tuesday, January 27, 2026</div>
          <div class="issue-preview">Daily news digest</div>
        </a>
      </li>
    </ul>
  </main>

  <footer>
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/archive/">Archive</a>
    </div>
    <p class="footer-note">
      The Parallax is generated using AI analysis of news sources across the political spectrum.<br>
      Pittsburgh, PA
    </p>
  </footer>

  <script>
    // Nav shadow on scroll
    const nav = document.querySelector('nav');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 10) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    });
  </script>
</body>
</html>
